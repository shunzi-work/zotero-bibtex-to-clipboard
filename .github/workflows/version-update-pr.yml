name: Prepare Version Update PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (for example, 2.1.3)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update manifest and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          semver = re.compile(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          match = semver.fullmatch(version)
          if not match:
              raise SystemExit("Version must be a stable semantic version in X.Y.Z format.")

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          current_version = manifest["version"]
          current_match = semver.fullmatch(current_version)
          if not current_match:
              raise SystemExit(f"Current manifest version is not X.Y.Z: {current_version}")
          if tuple(map(int, match.groups())) <= tuple(map(int, current_match.groups())):
              raise SystemExit(f"New version {version} must be greater than {current_version}.")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          unreleased_match = re.search(r"(?m)^## Unreleased\s*$", changelog)
          if not unreleased_match:
              raise SystemExit("CHANGELOG.md must contain exactly one '## Unreleased' section.")
          if len(re.findall(r"(?m)^## Unreleased\s*$", changelog)) != 1:
              raise SystemExit("CHANGELOG.md must contain exactly one '## Unreleased' section.")

          remaining = changelog[unreleased_match.end():]
          next_section = re.search(r"(?m)^## ", remaining)
          if next_section:
              unreleased_notes = remaining[:next_section.start()].strip()
              following_sections = remaining[next_section.start():]
          else:
              unreleased_notes = remaining.strip()
              following_sections = ""
          if not unreleased_notes:
              raise SystemExit("There are no notes under '## Unreleased' to include in this release.")
          if re.search(rf"(?m)^## {re.escape(version)}(?:\s|$)", changelog):
              raise SystemExit(f"CHANGELOG.md already has a section for {version}.")

          manifest["version"] = version
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          release_date = datetime.date.today().isoformat()
          changelog = (
              changelog[:unreleased_match.end()]
              + f"\n\n## {version} - {release_date}\n\n"
              + unreleased_notes
              + ("\n\n" + following_sections.lstrip("\n") if following_sections else "\n")
          )
          changelog_path.write_text(changelog, encoding="utf-8")
          print(f"Prepared version {version} dated {release_date}.")
          PY

      - name: Open or update version pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: release/version-${{ inputs.version }}
          delete-branch: true
          commit-message: "chore: prepare v${{ inputs.version }} release"
          title: "Prepare BibClip v${{ inputs.version }} release"
          body: |
            Updates `manifest.json` to v${{ inputs.version }} and moves the current
            `Unreleased` changelog notes into a dated release section.

            Review the release notes and version before merging. After merge, push
            the matching `v${{ inputs.version }}` tag to build and publish the XPI.
