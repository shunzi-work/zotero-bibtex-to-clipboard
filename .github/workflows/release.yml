name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New stable version (for example, 2.1.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare version and release notes
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          semver = re.compile(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          match = semver.fullmatch(version)
          if not match:
              raise SystemExit("Version must be a stable semantic version in X.Y.Z format.")
          requested = tuple(map(int, match.groups()))

          tag = f"v{version}"
          tag_exists = subprocess.run(
              ["git", "rev-parse", "--verify", "--quiet", f"refs/tags/{tag}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          def has_release_section(changelog):
              return re.search(rf"(?m)^## {re.escape(version)}(?:\s|$)", changelog)

          mode = None
          if tag_exists:
              tagged_manifest = json.loads(
                  subprocess.check_output(["git", "show", f"{tag}:manifest.json"], text=True)
              )
              tagged_changelog = subprocess.check_output(
                  ["git", "show", f"{tag}:CHANGELOG.md"], text=True
              )
              if tagged_manifest.get("version") != version or not has_release_section(tagged_changelog):
                  raise SystemExit(f"Existing tag {tag} does not contain the expected release files.")
              changelog = tagged_changelog
              mode = "resume"
          else:
              manifest_path = Path("manifest.json")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              current_version = manifest.get("version", "")
              current_match = semver.fullmatch(current_version)
              if not current_match:
                  raise SystemExit(f"Current manifest version is not X.Y.Z: {current_version}")
              current = tuple(map(int, current_match.groups()))
              changelog_path = Path("CHANGELOG.md")
              changelog = changelog_path.read_text(encoding="utf-8")

              if requested < current:
                  raise SystemExit(f"New version {version} must be greater than {current_version}.")
              if requested == current:
                  if not has_release_section(changelog):
                      raise SystemExit(
                          f"Version {version} is already in manifest.json but has no matching changelog section."
                      )
                  mode = "tag"
              else:
                  unreleased_matches = list(re.finditer(r"(?m)^## Unreleased\s*$", changelog))
                  if len(unreleased_matches) != 1:
                      raise SystemExit("CHANGELOG.md must contain exactly one '## Unreleased' section.")
                  if has_release_section(changelog):
                      raise SystemExit(f"CHANGELOG.md already has a section for {version}.")

                  unreleased = unreleased_matches[0]
                  remaining = changelog[unreleased.end():]
                  next_section = re.search(r"(?m)^## ", remaining)
                  if next_section:
                      notes = remaining[:next_section.start()].strip()
                      following_sections = remaining[next_section.start():]
                  else:
                      notes = remaining.strip()
                      following_sections = ""
                  if not notes:
                      raise SystemExit("There are no notes under '## Unreleased' to release.")

                  manifest["version"] = version
                  manifest_path.write_text(
                      json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
                      encoding="utf-8",
                  )
                  changelog = (
                      changelog[:unreleased.end()]
                      + f"\n\n## {version} - {datetime.date.today().isoformat()}\n\n"
                      + notes
                      + ("\n\n" + following_sections.lstrip("\n") if following_sections else "\n")
                  )
                  changelog_path.write_text(changelog, encoding="utf-8")
                  mode = "prepare"

          section = has_release_section(changelog)
          if not section:
              raise SystemExit(f"CHANGELOG.md has no release notes for {version}.")
          remaining = changelog[section.end():]
          next_section = re.search(r"(?m)^## ", remaining)
          notes = remaining[:next_section.start()] if next_section else remaining
          notes = notes.strip()
          if not notes:
              raise SystemExit(f"Release notes for {version} are empty.")
          release_body = (
              "### Changes\n\n"
              + notes
              + "\n\n### Install\n"
              + f"1. Download `bibclip-{version}.xpi` below\n"
              + "2. In Zotero: **Tools → Plugins → ⚙️ → Install Plugin from File...**\n"
          )
          Path("release-notes.md").write_text(release_body, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
          print(f"Prepared BibClip v{version} ({mode}).")
          PY

      - name: Commit version, changelog, and tag
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ steps.prepare.outputs.mode }}
        run: |
          set -e
          TAG="v${VERSION}"
          if [ "$RELEASE_MODE" = "prepare" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json CHANGELOG.md
            git commit -m "chore: prepare BibClip v${VERSION} release"
            git tag -a "$TAG" -m "BibClip v${VERSION}"
            git push origin HEAD:refs/heads/main
            git push origin "refs/tags/${TAG}"
          elif [ "$RELEASE_MODE" = "tag" ]; then
            git tag -a "$TAG" -m "BibClip v${VERSION}"
            git push origin "refs/tags/${TAG}"
          elif [ "$RELEASE_MODE" = "resume" ]; then
            git checkout --detach "refs/tags/${TAG}"
          else
            echo "Unexpected release mode: ${RELEASE_MODE}" >&2
            exit 1
          fi

      - name: Build XPI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          zip -r "bibclip-${VERSION}.xpi" \
            manifest.json \
            bootstrap.js \
            prefs.js \
            chrome/content/scripts/bibclip.js \
            chrome/content/icon.svg \
            chrome/content/preferences.xhtml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.version }}"
          target_commitish: main
          name: "BibClip v${{ inputs.version }}"
          body_path: release-notes.md
          files: bibclip-${{ inputs.version }}.xpi
          fail_on_unmatched_files: true
          draft: false
          prerelease: false